<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse · My Work dashboard (prototype)</title>
<style>
:root{
  --bg:#F6F4EE; --card:#FFFDF8; --card-2:#F9F7F1; --ink:#1F1E1A; --ink-2:#55524A; --ink-3:#8A877D;
  --line:#E4E0D5; --line-2:#EEEAE0; --header:#1F1E1A;
  --accent:#B05A3C; --accent-soft:#F4E4DC; --late:#A33A4A; --late-soft:#F6E1E4; --ok:#3E6B52; --ok-soft:#E2EEE6;
  --s-todo:#9A968B; --s-prog:#3F6E8C; --s-review:#C08A2E; --s-word:#7A5C99; --s-blocked:#A33A4A;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --r:14px; --r-sm:10px; --gap:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
/* prototype bar */
.proto{background:#2B2A25;color:#D9D5CA;font-size:12.5px;padding:8px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.proto b{color:#fff;font-weight:600}
.seg{display:inline-flex;background:#3A3832;border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;color:#D9D5CA;padding:4px 11px;border-radius:999px;font-size:12.5px}
.seg button.on{background:#F6F4EE;color:var(--ink)}
.proto .note{margin-left:auto;opacity:.75}
/* app header */
header.app{background:var(--header);color:#fff;display:flex;align-items:center;gap:28px;padding:0 28px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600}
.logo i{width:30px;height:30px;border-radius:8px;background:#F4E4DC;display:grid;place-items:center}
nav.main{display:flex;gap:4px}
nav.main button{background:transparent;border:0;color:#BDB9AE;padding:8px 12px;border-radius:8px}
nav.main button.on{color:#fff;background:#34322C}
.who{margin-left:auto;color:#BDB9AE;font-size:13px}
/* page */
.wrap{max-width:1240px;margin:0 auto;padding:28px 28px 60px}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.plan{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin-bottom:var(--gap)}
.plan b{font-family:var(--serif);font-size:17px;font-weight:600}
.plan span{color:var(--ink-3)}
.plan a{margin-left:auto;font-weight:600;text-decoration:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--gap);align-items:start}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:var(--gap)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;transition:border-color .15s;color:var(--ink);display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;height:100%;-webkit-appearance:none;appearance:none}
.stat:hover{border-color:var(--ink-3)}
.stat .n{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;margin-bottom:8px}
.stat .l{font-weight:600;color:var(--ink)}
.stat .d{color:var(--ink-3);font-size:12.5px}
.stat.late .n{color:var(--late)} .stat.soon .n{color:var(--accent)} .stat.zero .n{color:var(--ink-3)}
/* sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--gap);overflow:hidden}
.sec-h{display:flex;align-items:baseline;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);cursor:pointer;user-select:none}
.sec-h h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.sec-h .count{color:var(--ink-3)}
.sec-h .why{color:var(--ink-3);font-size:12.5px}
.sec-h .pill-late{color:var(--late);font-size:12.5px;font-weight:600}
.sec-h .tog{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.sec.closed .sec-b{display:none}
.group{padding:10px 18px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--card-2);border-bottom:1px solid var(--line-2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.row:hover{background:var(--card-2)}
.row:last-child{border-bottom:0}
.row .t{font-weight:500}
.row .m{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pr{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);min-width:56px;text-align:right}
.pr.URGENT{color:var(--late)} .pr.HIGH{color:var(--accent)}
.due{font-size:12.5px;white-space:nowrap;color:var(--ink-2);min-width:96px;text-align:right}
.due.late{color:var(--late);font-weight:600} .due.today{color:var(--accent);font-weight:600}
.row.sub{grid-template-columns:minmax(0,1fr) auto auto}
.empty{padding:22px 18px;color:var(--ink-3);text-align:center}
.more{display:block;width:100%;border:0;background:transparent;color:var(--accent);padding:10px;font-weight:600;border-top:1px solid var(--line-2)}
.paused{color:var(--ink-3);font-size:13px;padding:4px 2px}
/* rail */
.rail .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:var(--gap)}
.rail h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 10px}
.donut-wrap{display:flex;gap:16px;align-items:center}
.legend{list-style:none;margin:0;padding:0;flex:1}
.legend li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;cursor:pointer;border-radius:6px}
.legend li:hover{background:var(--card-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;font-weight:600}
.donut-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.donut-foot .late{color:var(--late);font-weight:600}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.att li:last-child{border-bottom:0}
.att .ic{width:26px;height:26px;border-radius:7px;background:var(--card-2);display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.att .tx{flex:1}
.att .tx div{font-weight:500}
.att .tx span{color:var(--ink-3);font-size:12px}
.att .n{font-family:var(--serif);font-size:19px;font-weight:600}
.att .n.zero{color:var(--ink-3)}
.later{border:1.5px dashed var(--line)!important;background:transparent!important;color:var(--ink-3)}
.later h3{color:var(--ink-3)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--line-2);color:var(--ink-3);padding:2px 7px;border-radius:5px;margin-bottom:8px}
.later p{margin:0;font-size:13px}
.role-links a{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.role-links a:last-child{border-bottom:0}
.role-links a span{margin-left:auto;color:var(--accent)}
.role-title{color:var(--ink-3);font-size:12.5px;margin:-6px 0 6px}
.sample{border-color:#E7C9BB!important}
.tag-sample{background:var(--accent-soft);color:var(--accent)}
.focus{margin:0;padding-left:20px}
.focus li{padding:8px 0;border-bottom:1px solid var(--line-2)}
.focus li::marker{font-family:var(--serif);font-weight:600;color:var(--accent)}
.ft{display:flex;gap:8px;align-items:baseline;font-weight:600}
.ft em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent);white-space:nowrap}
.ft em.late{color:var(--late)}
.fexp{background:var(--card-2);border-left:3px solid var(--accent);border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.fexp b{color:var(--ink)}
.fw{color:var(--ink-2);font-size:13px;margin-top:2px}
.flater{font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.fsrc{font-size:11.5px;color:var(--ink-3);margin:8px 0 0}
.ind{padding:9px 0;border-bottom:1px solid var(--line-2)}
.il{display:flex;gap:8px;align-items:baseline;font-size:13px}
.il b{margin-left:auto;font-family:var(--serif);font-size:20px;white-space:nowrap}
.il small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400}
.bar{height:6px;background:var(--line-2);border-radius:99px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.in{font-size:11.5px;color:var(--ink-3)}
.datenote{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin:0 0 8px}
.temp-h{display:flex;align-items:center;gap:8px}
.temp-h h3{margin:0}
.temp-pill{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.temp-read{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin:10px 0 2px}
.temp-why{font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.temp-key{display:flex;flex-direction:column;gap:3px;margin-top:10px;font-size:11.5px;color:var(--ink-3)}
.temp-key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;-webkit-appearance:none;appearance:none;transition:all .15s;position:relative}
.fcard:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.fcard .n{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1;margin-bottom:6px}
.fcard .l{font-weight:600;font-size:13.5px;line-height:1.25}
.fcard .d{color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.3}
.t-late .n{color:var(--late)} .t-accent .n{color:var(--accent)} .t-word .n{color:var(--s-word)} .t-review .n{color:var(--s-review)} .t-plain .n{color:var(--ink)}
.fcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;background:#fff}
.fcard.on::after{content:"Filtering ✕";position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.fbar{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:9px 14px;margin-bottom:var(--gap);font-size:13px}
.fbar button{margin-left:auto;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px}
.fclear{background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:14px 18px;font-weight:600;margin-bottom:var(--gap)}
.fcards + .sec, .fcards + section{margin-top:8px}
.toprow{display:flex;align-items:flex-start;gap:20px}
.toprow h1{flex:1}
.avail-wrap{position:relative;flex:none;margin-top:4px}
.avail{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;color:var(--ink)}
.avail i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 4px var(--line-2)}
.avail span{color:var(--ink-3);font-size:11px}
.avail[aria-expanded="true"]{border-color:var(--ink)}
.pop{position:absolute;top:calc(100% + 12px);right:0;width:400px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:var(--r);box-shadow:0 18px 40px rgba(31,30,26,.18);z-index:20;font-size:13px}
.pop-caret{position:absolute;top:-11px;right:28px;width:14px;height:14px;background:var(--ok);transform:rotate(45deg);border-radius:2px}
.pop-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2);position:relative;background:var(--card);border-radius:var(--r) var(--r) 0 0}
.pop-h b{font-family:var(--serif);font-size:18px}
.pop-h em{margin-left:auto;font-style:normal;color:var(--ink-3);font-size:12px}
.pop-x{border:0;background:transparent;color:var(--ink-2);font-size:14px}
.pop-s{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.pop-now{display:flex;gap:12px;align-items:flex-start}
.pop-now i{width:14px;height:14px;border-radius:50%;margin-top:8px;box-shadow:0 0 0 4px var(--line-2)}
.pop-big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.pop-sub{color:var(--ink-2)}
.pop-sees{margin:10px 0 12px 26px;color:var(--ink-2)}
.pop-sees span{background:var(--accent-soft);color:var(--accent);font-weight:600;padding:3px 9px;border-radius:999px;margin-left:4px}
.pop-seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.pop-seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-weight:500}
.pop-seg button:last-child{border-right:0}
.pop-seg button.on{background:var(--card-2);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.pop-seg i{width:8px;height:8px;border-radius:50%}
.pop-sec{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.pop-sec:last-child{border-bottom:0}
.pop-sec p{margin:6px 0 0;color:var(--ink-2)}
.pop-lab{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--ink-3)}
.pop-row{display:flex;align-items:center}
.pop-row a,.pop-row2 a{margin-left:auto;font-weight:600}
.pop-row2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pop-row2:last-child{border-bottom:0}
.pop-k{color:var(--ink-3);font-size:12px}
body.phone .toprow{flex-direction:column;gap:8px}
body.phone .pop{right:auto;left:0;width:340px}
body.phone .pop-caret{right:auto;left:28px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,30,26,.35);display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:11;transform:translateX(100%);transition:transform .2s;padding:24px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.1)}
.open .scrim{display:block} .open .drawer{transform:none}
.drawer h2{font-family:var(--serif);font-size:22px;margin:6px 0 12px;font-weight:600}
.drawer dl{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:0 0 18px}
.drawer dt{color:var(--ink-3)} .drawer dd{margin:0}
.drawer .x{float:right;border:0;background:var(--card-2);border-radius:8px;padding:4px 10px}
.drawer .hint{background:var(--card-2);border-radius:var(--r-sm);padding:12px;color:var(--ink-2);font-size:13px}
.placeholder{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:40px;text-align:center;color:var(--ink-3)}
/* phone */
body.phone .stage{max-width:390px;margin:20px auto;border:10px solid #2B2A25;border-radius:34px;overflow:hidden;background:var(--bg)}
body.phone header.app{padding:0 16px;gap:12px} body.phone nav.main,body.phone .who{display:none}
body.phone .wrap{padding:18px 14px 40px}
body.phone h1{font-size:25px}
body.phone .grid{display:flex;flex-direction:column;gap:0;align-items:stretch}
body.phone .grid > *{width:100%}
body.phone .stats{grid-template-columns:1fr 1fr}
body.phone .fcards{grid-template-columns:1fr 1fr}
body.phone .stat .n{font-size:36px}
body.phone .left,body.phone .rail{display:contents}
body.phone .o-stats{order:1} body.phone .o-donut{order:2} body.phone .o-ai{order:3} body.phone .o-ind{order:4}
body.phone .o-client{order:5} body.phone .o-wait{order:6} body.phone .o-own{order:7}
body.phone .o-paused{order:8} body.phone .o-role{order:9}
body.phone .row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
body.phone .row .pr{display:none}
body.phone .row .st{grid-column:1;justify-self:start}
body.phone .sec-h .why{display:none}
body.phone .row .due{grid-row:1;grid-column:2}
@media (max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="proto">
  <b>Prototype</b>
  <span>View as</span>
  <div class="seg" id="persona"></div>
  <div class="seg" id="device"><button data-d="desktop" class="on">Desktop</button><button data-d="phone">Phone</button></div>
  <span class="note">A picture you can click. Nothing saves; names are NUCO's, numbers are made up.</span>
</div>

<div class="stage">
<header class="app">
  <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24"><path d="M2 13h5l2-6 4 12 3-9 2 3h4" fill="none" stroke="#B05A3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Pulse</div>
  <nav class="main" id="nav">
    <button class="on" data-s="mywork">My work</button><button data-s="projects">Projects</button><button data-s="heartbeat">Heartbeat</button><button data-s="vitals">Vitals</button><button data-s="team">Team &amp; roles</button>
  </nav>
  <div class="who" id="who"></div>
</header>

<div class="wrap" id="screen"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
let BASE = new Date(2026,10,18); // set per person in render()
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dueText(o){ if(o===null||o===undefined) return {txt:"no date",cls:""};
  const d=new Date(BASE); d.setDate(d.getDate()+o); const s=MON[d.getMonth()]+" "+d.getDate();
  if(o<0) return {txt:s+" · "+(-o)+"d late",cls:"late"}; if(o===0) return {txt:"Today",cls:"today"}; if(o===1) return {txt:"Tomorrow",cls:""}; return {txt:s,cls:""}; }
const STATUS = {
  "To do":{c:"var(--s-todo)"}, "In progress":{c:"var(--s-prog)"}, "Review":{c:"var(--s-review)"},
  "Needs a word":{c:"var(--s-word)"}, "Blocked":{c:"var(--s-blocked)"}
};
const PRI_RANK={URGENT:0,HIGH:1,MEDIUM:2,LOW:3};

/* ---------- sample people ---------- */
const PEOPLE = {
 paisha:{ name:"Paisha", role:"VP of Sales", hello:"Good morning Paisha.", base:[2027,0,13],
  dateNote:"Sample week: Wed Jan 13, 2027, week 6 of Paisha's transition period",
  client:[
   {t:"Join Marcus on Harbor Lane Bakery 30-day Scoreboard call", client:"Harbor Lane Bakery", project:"Harbor Lane Bakery Marketing Scoreboard", s:"In progress", p:"HIGH", o:1},
   {t:"Ride along: Dana's first Be Visible pitch", client:"Ridgeline Cycles", project:"CLIENT - Ridgeline Cycles - Social Media Management", s:"To do", p:"MEDIUM", o:2}
  ],
  waiting:[
   {t:"Approve Dana's Be Visible pitch script edits", owner:"Dana (Champion, Vista)", task:"Prep Be Visible pitch for Ridgeline Cycles", project:"Champion · Vista", o:-2},
   {t:"Send the Vista launch date so flyers can print", owner:"Laura", task:"Order Vista flyers and window decals", project:"City launch · Vista", o:0},
   {t:"Confirm which Champion hosts the February networking event", owner:"Dave", task:"Book February networking venue", project:"Sales Program", o:3}
  ],
  own:[
   {t:"Run Marcus's day-30 review (Fallbrook)", project:"Champion onboarding · Marcus (Fallbrook)", s:"In progress", p:"HIGH", o:0},
   {t:"Call back 2 Champion candidates for Vista", project:"Champion recruiting · North County", s:"To do", p:"URGENT", o:0},

function stPill(s){const c=STATUS[s].c;return `<span class="st" style="color:${c};border-color:${c}33;background:${c}14">${s}</span>`}

/* ---------- donut ---------- */
function donut(counts,total){
  const R=48,C=2*Math.PI*R; let off=0, segs="";
  Object.keys(STATUS).forEach(k=>{const n=counts[k]||0; if(!n) return; const len=C*n/total;
    segs+=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${STATUS[k].c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off+=len;});
  return `<svg width="120" height="120" viewBox="0 0 120 120" aria-label="Task status mix"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--line-2)" stroke-width="16"/>${segs}<text x="60" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="600" fill="var(--ink)">${total}</text><text x="60" y="76" text-anchor="middle" font-size="11" fill="var(--ink-3)">open tasks</text></svg>`;
}

function tempCard(P,tasks,counts,late,soon){

  let r;

  else if(allLate||(counts["Needs a word"]||0)) r={k:"Warm",c:"var(--s-review)",bg:"#F6ECD9",msg:"A few things slipping. Catch them today."};
  else r={k:"Cool",c:"var(--ok)",bg:"var(--ok-soft)",msg:"Everything on time. Keep it there."};
  const why=[allLate?`${allLate} late${wl?` (${wl} that others are waiting on)`:""}`:"nothing late", blocked?`${blocked} blocked`:"nothing blocked"].join(" · ");
  return `<div class="card o-donut temp" style="border-top:4px solid ${r.c}">
   <div class="temp-h"><h3>Your temp gauge</h3><span class="temp-pill" style="color:${r.c};background:${r.bg}">${r.k}</span></div>
   <div class="temp-read" style="color:${r.c}">${r.k === "Hot" ? "Running hot" : r.k === "Warm" ? "Running warm" : "Running cool"}</div>
   <div class="temp-why">${why}. ${r.msg}</div>
   <div class="donut-wrap">${donut(counts,tasks.length)}<ul class="legend">${Object.keys(STATUS).map(k=>`<li data-st="${k}"><i style="background:${STATUS[k].c}"></i>${k}<b>${counts[k]||0}</b></li>`).join("")}</ul></div>

  </div>`;
}

  else {x=P.ownSubs[i]; const d=dueText(x.o);
    html=`<span class="tag">Subtask on your own task</span><h2>${esc(x.t)}</h2><dl><dt>On</dt><dd>${esc(x.task)}</dd><dt>Due</dt><dd class="due ${d.cls}" style="text-align:left">${d.txt}</dd></dl>`;}
  document.getElementById("drawer").innerHTML=`<button class="x" onclick="closeDrawer()">Close</button>${html}<div class="hint">In Pulse this opens the task as it does today. Nothing about the task view changes.</div>`;
  document.body.classList.add("open");
}
function closeDrawer(){document.body.classList.remove("open")}
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("click",e=>{
  const r=e.target.closest(".row"); if(r){openDrawer(r.dataset.k,+r.dataset.i);return;}
  const t=e.target.closest("[data-tog]"); if(t){closed[t.dataset.tog]=!closed[t.dataset.tog];render();return;}
  if(e.target.closest("#availBtn")){availOpen=!availOpen;render();return;}
  const av=e.target.closest("[data-avail]"); if(av){avail[who]=av.dataset.avail;render();return;}
  if(e.target.closest("[data-avail-close]")){availOpen=false;render();return;}
  if(availOpen&&!e.target.closest(".pop")){availOpen=false;render();}
  const f=e.target.closest("[data-filter]"); if(f){filter=(filter===f.dataset.filter)?null:f.dataset.filter; closed={}; render(); return;}
  const j=e.target.closest("[data-jump]"); if(j){closed[j.dataset.jump]=false;render();document.querySelector(`[data-id="${j.dataset.jump}"]`).scrollIntoView({behavior:"smooth",block:"start"});return;}
  const n=e.target.closest("#nav button"); if(n){go(n.dataset.s);return;}
});
const ps=document.getElementById("persona");
ps.innerHTML=ORDER.map(k=>`<button data-p="${k}" class="${k===who?"on":""}">${PEOPLE[k].name} · ${PEOPLE[k].role}</button>`).join("");
ps.onclick=e=>{const b=e.target.closest("button"); if(!b) return; who=b.dataset.p; filter=null; availOpen=false; ps.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render();};
document.getElementById("device").onclick=e=>{const b=e.target.closest("button"); if(!b) return; document.querySelectorAll("#device button").forEach(x=>x.classList.toggle("on",x===b)); document.body.classList.toggle("phone",b.dataset.d==="phone");};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer(); if(availOpen){availOpen=false;render();}}});
render();
</script>
</body>
</html>
